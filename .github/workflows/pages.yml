# Requires Settings → Pages → Source: "GitHub Actions" (currently "Deploy from branch: prod").
# Until that flip, the legacy branch build keeps serving the site and this deploy job errors harmlessly.
name: pages
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage site (no repo tooling, no shadowed folders)
        run: |
          mkdir _site
          rsync -a \
            --exclude '.*' --exclude '_site' --exclude 'scripts' \
            --exclude 'AGENTS.md' --exclude 'CLAUDE.md' --exclude 'ROADMAP.md' \
            --exclude 'latent-journey' \
            ./ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
