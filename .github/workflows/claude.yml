# @claude on issues, PR comments and reviews. Only users with write access can trigger it (action default).
# Setup once: in Claude Code CLI run /install-github-app (installs the app + adds the secret),
# or `claude setup-token` locally and save it as repo secret CLAUDE_CODE_OAUTH_TOKEN.
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}   # alternative: API billing instead of subscription
          base_branch: prod
          claude_args: |
            --allowedTools "Bash(node scripts/check-site.mjs),Bash(node scripts/check-site.mjs --strict),Bash(curl -sI https://artsrun.github.io/:*)"
