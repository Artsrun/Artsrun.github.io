# Weekly: live link check + fleet hub-sync. Each opens/updates one issue labeled `audit`.
name: audit
on:
  schedule:
    - cron: "17 6 * * 1" # Mon 06:17 UTC = 10:17 Yerevan
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: urls
        name: Live URL for every page in the repo
        run: |
          list=$(find . -name '*.html' -not -path './.git/*' -not -path './latent-journey/*' -not -name 'probe.html' -not -name '404.html' \
            | sed -e 's#^\./#https://artsrun.github.io/#' -e 's#index\.html$##' | sort | tr '\n' ' ')
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --accept 200,206,429
            --exclude '^https?://(www\.)?(x|twitter)\.com'
            ${{ steps.urls.outputs.list }}
          output: lychee/out.md
          fail: false
      - if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/upsert-issue.sh "audit: broken links" lychee/out.md

  hub-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hub-sync.mjs | tee hub-sync.md
      - if: steps.sync.outputs.findings != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/upsert-issue.sh "audit: hub sync" hub-sync.md
